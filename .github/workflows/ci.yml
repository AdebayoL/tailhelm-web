name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:packs
      - run: npm run build

  database:
    # The runner image ships PostgreSQL 16, so no image is pulled from Docker Hub
    # (pulls there failed on 9 Oct 2026). Pinned so the version doesn't change under us.
    runs-on: ubuntu-24.04
    steps:
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "alter user postgres password 'postgres'"
      - uses: actions/checkout@v4
      - run: npm run test:db
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
